name: Build Amethyst-iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Set up JDK 8 (Zulu arm64)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Register JDK 8 with macOS java_home
        run: |
          sudo mkdir -p /Library/Java/JavaVirtualMachines
          BUNDLE_DIR=$(find "$(cd "$JAVA_HOME/../.." && pwd)" -maxdepth 2 -name "*.jdk" -type d 2>/dev/null | head -n 1)

          if [ -n "$BUNDLE_DIR" ] && [ -f "$BUNDLE_DIR/Contents/Info.plist" ]; then
            sudo ln -sfn "$BUNDLE_DIR" /Library/Java/JavaVirtualMachines/zulu-8.jdk
          elif [ -f "$JAVA_HOME/../Info.plist" ]; then
            sudo ln -sfn "$(cd "$JAVA_HOME/.." && pwd)" /Library/Java/JavaVirtualMachines/zulu-8.jdk
          else
            sudo mkdir -p /Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents
            sudo ln -sfn "$JAVA_HOME" /Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home
            cat << 'EOF' | sudo tee /Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>net.azul.zulu.8</string>
              <key>CFBundleName</key>
              <string>Zulu 8</string>
              <key>JavaVM</key>
              <dict>
                  <key>JVMPlatformVersion</key>
                  <string>1.8</string>
                  <key>JVMVersion</key>
                  <string>1.8.0</string>
              </dict>
          </dict>
          </plist>
          EOF
          fi
          echo "BOOTJDK=${JAVA_HOME}/bin" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          brew install cmake ninja ldid dpkg

      - name: Compile Native Libraries & App
        run: |
          make -j$(sysctl -n hw.ncpu) BOOTJDK="${JAVA_HOME}/bin"

      - name: Package IPA with Extended Memory Limit
        run: |
          mkdir -p build/Payload
          cp -r build/Amethyst.app build/Payload/
          
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.kernel.extended-virtual-addressing</key>
              <true/>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          ldid -Sentitlements.plist build/Payload/Amethyst.app
          
          cd build
          zip -r9 Amethyst-Pitched.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Patched
          path: build/Amethyst-Pitched.ipa
          retention-days: 7
